name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version
          brew install xcodegen

      - name: Make spec
        run: |
          printf '%s\n' \
            'name: DiscordBotManager' \
            'options:' \
            '  bundleIdPrefix: com.ethereal' \
            '  objectVersion: 56' \
            'settings:' \
            '  base:' \
            '    IPHONEOS_DEPLOYMENT_TARGET: "16.0"' \
            '    SWIFT_VERSION: "5.0"' \
            '    TARGETED_DEVICE_FAMILY: "1,2"' \
            'targets:' \
            '  DiscordBotManager:' \
            '    type: application' \
            '    platform: iOS' \
            '    sources: [App]' \
            '    settings:' \
            '      base:' \
            '        PRODUCT_BUNDLE_IDENTIFIER: com.ethereal.discordbotmanager' \
            '        CODE_SIGNING_ALLOWED: "NO"' \
            '        CODE_SIGNING_REQUIRED: "NO"' \
            '        CODE_SIGN_IDENTITY: ""' \
            '        CODE_SIGN_STYLE: Manual' \
            '        DEVELOPMENT_TEAM: ""' \
            '        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"' \
            '        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"' \
            > project.yml
          cat project.yml

      - name: Gen project
        run: |
          xcodegen generate
          ls -la
          grep objectVersion DiscordBotManager.xcodeproj/project.pbxproj

      - name: Build
        run: |
          xcodebuild -project DiscordBotManager.xcodeproj -scheme DiscordBotManager -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -derivedDataPath build clean build
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n1)
          echo "APP=$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry DiscordBotManager.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: DiscordBotManager-ipa
          path: DiscordBotManager.ipa

      - name: Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date -u +%Y%m%d-%H%M%S)"
          git config user.name builder
          git config user.email builder@users.noreply.github.com
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" DiscordBotManager.ipa --title "$TAG" --notes unsigned --latest
