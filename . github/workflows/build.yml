name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          URL=$(curl -s https://api.github.com/repos/yonaskolb/XcodeGen/releases/latest \
            | grep browser_download_url | grep 'xcodegen.zip' | head -n1 | cut -d '"' -f 4)
          if [ -z "$URL" ]; then
            URL="https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip"
          fi
          curl -sL -o /tmp/xcg.zip "$URL"
          unzip -q -o /tmp/xcg.zip -d /tmp/xcg
          BIN=$(find /tmp/xcg -type f -name xcodegen | head -n1)
          chmod +x "$BIN"
          echo "$(dirname "$BIN")" >> $GITHUB_PATH

      - name: Generate Xcode project
        run: |
          cat > project.yml <<'YAML'
          name: DiscordBotManager
          options:
            bundleIdPrefix: com.ethereal
          settings:
            base:
              IPHONEOS_DEPLOYMENT_TARGET: "16.0"
              SWIFT_VERSION: "5.9"
              TARGETED_DEVICE_FAMILY: "1,2"
              ENABLE_BITCODE: "NO"
          targets:
            DiscordBotManager:
              type: application
              platform: iOS
              sources:
                - App
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.ethereal.discordbotmanager
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGN_STYLE: Manual
                  DEVELOPMENT_TEAM: ""
                  INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
                  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
          YAML
          xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild -project DiscordBotManager.xcodeproj \
            -scheme DiscordBotManager \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -derivedDataPath build clean build
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n1)
          echo "APP=$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry DiscordBotManager.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: DiscordBotManager-ipa
          path: DiscordBotManager.ipa

      - name: Publish release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "builder"
          git config user.email "builder@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" DiscordBotManager.ipa \
            --title "DiscordBotManager $TAG" \
            --notes "自动构建，下载后用签名工具重签安装" \
            --latest
