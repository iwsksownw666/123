name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_15.2.app || true

      - name: Install XcodeGen 2.38.0
        run: |
          curl -sL -o /tmp/xcg.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.38.0/xcodegen.zip
          unzip -q -o /tmp/xcg.zip -d /tmp/xcg
          BIN=$(find /tmp/xcg -type f -name xcodegen | head -n1)
          chmod +x "$BIN"
          echo "$(dirname "$BIN")" >> $GITHUB_PATH
          xcodegen --version

      - name: Generate Xcode project
        run: |
          cat > project.yml <<'YAML'
          name: DiscordBotManager
          options:
            bundleIdPrefix: com.ethereal
            objectVersion: 56
          settings:
            base:
              IPHONEOS_DEPLOYMENT_TARGET: "16.0"
              SWIFT_VERSION: "5.0"
              TARGETED_DEVICE_FAMILY: "1,2"
          targets:
            DiscordBotManager:
              type: application
              platform: iOS
              sources:
                - App
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.ethereal.discordbotmanager
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGN_STYLE: Manual
                  DEVELOPMENT_TEAM: ""
                  INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
                  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
          YAML
          xcodegen generate
          ls -la
          head -5 DiscordBotManager.xcodeproj/project.pbxproj

      - name: Build unsigned app
        run: |
          xcodebuild -project DiscordBotManager.xcodeproj \
            -scheme DiscordBotManager \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -derivedDataPath build clean build
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n1)
          echo "APP=$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry DiscordBotManager.ipa Payload
          ls -la DiscordBotManager.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DiscordBotManager-ipa
          path: DiscordBotManager.ipa

      - name: Publish release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "builder"
          git config user.email "builder@users.noreply.github.com"
          git tag "$TAG" 2>/dev/null || true
          git push origin "$TAG" 2>/dev/null || true
          gh release create "$TAG" DiscordBotManager.ipa \
            --title "DiscordBotManager $TAG" \
            --notes "unsigned ipa, resign before install" \
            --latest
